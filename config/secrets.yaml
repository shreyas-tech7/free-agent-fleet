# Secret registry. This file holds names and rules. It never holds a secret value.
#
# Each secret has exactly one reader service. `fleetctl secret set NAME` writes the value
# to `file` with the owner in `owner` and mode 600. No other service reads that file.
#
# Fields:
#   name        Environment variable name.
#   group       Setup group for `fleetctl secret wizard --group GROUP`.
#   service     The one service that reads this secret.
#   file        Absolute path of the secret file.
#   owner       Owner of the file. The service runs as this user.
#   format      Regular expression that the value must match. Checked before saving.
#   purpose     One short sentence.
#   get_it      Where the owner makes the key.
#   revoke      Where the owner revokes the key.
#   check       One free test call. `fleetctl secret check` runs it.
#   alias       A second name for the same value in the same file. Hermes reads SLACK_BOT_TOKEN, and the owner sets SLACK_HERMES_BOT_TOKEN.
#   auto        true when the installer makes the value. router_key when the router issues it.
#               The owner never types an auto value.
#   data_use    Router keys only. unverified until the owner reads the provider terms.
#
# Rule R1: every key here is for a free plan that needs no payment method.

version: 1

groups:
  router:    "Model providers for the router (free plans only)"
  publisher: "Social accounts and channels. Only the Publisher reads them."
  deployer:  "Cloudflare token. Only the Deployer reads it."
  control:   "Control bot tokens for Telegram and Discord"
  slack:     "Slack app tokens: Fleet HQ (the control bot) and Hermes (the orchestrator)"
  briefing:  "SMTP login for the daily brief"
  backup:    "GitHub token that lets the nightly backup push the repository"
  internal:  "Keys that the installer makes. The owner never types them."

secrets:
  # ---- router ----
  - name: GROQ_API_KEY
    group: router
    service: router
    file: /etc/agent-fleet/secrets/router.env
    owner: fleetops
    format: '^gsk_[A-Za-z0-9]{20,}$'
    purpose: "Groq free plan API key"
    get_it: "https://console.groq.com/keys"
    revoke: "https://console.groq.com/keys"
    terms: "https://groq.com/privacy-policy"
    data_use: unverified
    check: {method: GET, url: "https://api.groq.com/openai/v1/models", auth: bearer}
  - name: CLOUDFLARE_AI_API_TOKEN
    group: router
    service: router
    file: /etc/agent-fleet/secrets/router.env
    owner: fleetops
    format: '^[A-Za-z0-9_\-]{40}$'
    purpose: "Cloudflare Workers AI token, scope Workers AI read and run only"
    get_it: "https://dash.cloudflare.com/profile/api-tokens"
    revoke: "https://dash.cloudflare.com/profile/api-tokens"
    terms: "https://developers.cloudflare.com/workers-ai/platform/data-usage/"
    data_use: unverified
    check: {method: GET, url: "https://api.cloudflare.com/client/v4/user/tokens/verify", auth: bearer}
  - name: CLOUDFLARE_ACCOUNT_ID
    group: router
    service: router
    file: /etc/agent-fleet/secrets/router.env
    owner: fleetops
    format: '^[0-9a-f]{32}$'
    purpose: "Cloudflare account ID for Workers AI (an identifier, kept with the token)"
    get_it: "https://dash.cloudflare.com"
    revoke: "not applicable"
    terms: "https://developers.cloudflare.com/workers-ai/platform/data-usage/"
    data_use: unverified
    check: {type: skip, reason: "checked together with the token"}
  - name: OPENROUTER_API_KEY
    group: router
    service: router
    file: /etc/agent-fleet/secrets/router.env
    owner: fleetops
    format: '^sk-or-v1-[A-Za-z0-9]{20,}$'
    purpose: "OpenRouter key. Use free models (names end in :free) only."
    get_it: "https://openrouter.ai/keys"
    revoke: "https://openrouter.ai/keys"
    terms: "https://openrouter.ai/privacy"
    data_use: unverified
    check: {method: GET, url: "https://openrouter.ai/api/v1/auth/key", auth: bearer}
  - name: GEMINI_API_KEY
    group: router
    service: router
    file: /etc/agent-fleet/secrets/router.env
    owner: fleetops
    format: '^AIza[0-9A-Za-z_\-]{30,}$'
    purpose: "Google AI Studio key, free plan"
    get_it: "https://aistudio.google.com/apikey"
    revoke: "https://aistudio.google.com/apikey"
    terms: "https://ai.google.dev/gemini-api/terms"
    data_use: unverified
    check: {method: GET, url: "https://generativelanguage.googleapis.com/v1beta/models", auth: header, header: "x-goog-api-key"}


  - name: COHERE_API_KEY
    group: router
    service: router
    file: /etc/agent-fleet/secrets/router.env
    owner: fleetops
    format: '^(cohere_)?[A-Za-z0-9_\-]{30,80}$'
    purpose: "Cohere trial API key. Non-commercial. 20 requests per minute and 1000 calls per month"
    get_it: "https://dashboard.cohere.com/api-keys"
    revoke: "https://dashboard.cohere.com/api-keys"
    terms: "https://cohere.com/terms-of-use"
    data_use: unverified
    check: {method: GET, url: "https://api.cohere.com/v1/models?page_size=1", auth: bearer}
  - name: NVIDIA_API_KEY
    group: router
    service: router
    file: /etc/agent-fleet/secrets/router.env
    owner: fleetops
    format: '^nvapi-[A-Za-z0-9_\-]{30,}$'
    purpose: "NVIDIA build.nvidia.com trial key. For evaluation and prototyping only"
    get_it: "https://build.nvidia.com/settings/api-keys"
    revoke: "https://build.nvidia.com/settings/api-keys"
    terms: "https://www.nvidia.com/en-us/agreements/trial-service/"
    data_use: unverified
    check: {method: GET, url: "https://integrate.api.nvidia.com/v1/models", auth: bearer}
  # ---- publisher ----
  - name: LLM7_API_KEY
    group: router
    service: router
    file: /etc/agent-fleet/secrets/router.env
    owner: fleetops
    format: '^[A-Za-z0-9_\-\.]{16,200}$'
    purpose: "LLM7 token. Free turbo models only. See D-069"
    get_it: "https://dash.llm7.io/"
    revoke: "https://dash.llm7.io/"
    terms: "https://docs.llm7.io"
    data_use: unverified
    check: {type: openai_probe, url: "https://api.llm7.io/v1/chat/completions", model: "gpt-oss:20b"}
  - name: AION_API_KEY
    group: router
    service: router
    file: /etc/agent-fleet/secrets/router.env
    owner: fleetops
    format: '^[A-Za-z0-9_\-\.]{16,200}$'
    purpose: "Aion Labs key. Free grant only, no card. See D-069"
    get_it: "https://aionlabs.ai"
    revoke: "https://aionlabs.ai"
    terms: "https://aionlabs.ai"
    data_use: unverified
    check: {type: openai_probe, url: "https://api.aionlabs.ai/v1/chat/completions", model: "aion-labs/aion-3.5-mini"}
  - name: GONKA_API_KEY
    group: router
    service: router
    file: /etc/agent-fleet/secrets/router.env
    owner: fleetops
    format: '^[A-Za-z0-9_\-\.]{16,200}$'
    purpose: "Gonka Broker key. Monthly free grant only, no card, no deposit. See D-069 and D-072"
    get_it: "https://app.gonkabroker.com"
    revoke: "https://app.gonkabroker.com"
    terms: "https://docs.gonkabroker.com/guides/billing-and-deposits/"
    data_use: unverified
    check: {type: openai_probe, url: "https://proxy.gonkabroker.com/v1/chat/completions", model: "deepseek-ai/DeepSeek-V4-Flash-0731"}

  - name: BLUESKY_APP_PASSWORD
    group: publisher
    service: publisher
    file: /etc/agent-fleet/secrets/publisher.env
    owner: fleetops
    format: '^[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}$'
    purpose: "Bluesky app password. Never use the main password."
    get_it: "https://bsky.app/settings/app-passwords"
    revoke: "https://bsky.app/settings/app-passwords"
    check: {type: bluesky_session}
  - name: MASTODON_ACCESS_TOKEN
    group: publisher
    service: publisher
    file: /etc/agent-fleet/secrets/publisher.env
    owner: fleetops
    format: '^[A-Za-z0-9_\-]{20,}$'
    purpose: "Mastodon access token with scopes write:statuses and write:accounts"
    get_it: "your Mastodon instance, Preferences, Development"
    revoke: "your Mastodon instance, Preferences, Development"
    check: {type: mastodon_verify}
  - name: DISCORD_PUBLISHER_BOT_TOKEN
    group: publisher
    service: publisher
    file: /etc/agent-fleet/secrets/publisher.env
    owner: fleetops
    format: '^[A-Za-z0-9_\-]{20,}\.[A-Za-z0-9_\-]{5,}\.[A-Za-z0-9_\-]{20,}$'
    purpose: "Bot token for the fleet's own Discord server"
    get_it: "https://discord.com/developers/applications"
    revoke: "https://discord.com/developers/applications"
    check: {method: GET, url: "https://discord.com/api/v10/users/@me", auth: header, header: "Authorization", prefix: "Bot "}
  - name: TELEGRAM_PUBLISHER_BOT_TOKEN
    group: publisher
    service: publisher
    file: /etc/agent-fleet/secrets/publisher.env
    owner: fleetops
    format: '^[0-9]{6,12}:[A-Za-z0-9_\-]{30,}$'
    purpose: "Bot token that posts to the fleet's Telegram channel"
    get_it: "https://t.me/BotFather"
    revoke: "https://t.me/BotFather"
    check: {type: telegram_getme}
  - name: DEVTO_API_KEY
    group: publisher
    service: publisher
    file: /etc/agent-fleet/secrets/publisher.env
    owner: fleetops
    format: '^[A-Za-z0-9]{20,}$'
    purpose: "dev.to (Forem) API key"
    get_it: "https://dev.to/settings/extensions"
    revoke: "https://dev.to/settings/extensions"
    check: {method: GET, url: "https://dev.to/api/users/me", auth: header, header: "api-key", quiet: true}
  - name: GITHUB_PUBLISHER_TOKEN
    group: publisher
    service: publisher
    file: /etc/agent-fleet/secrets/publisher.env
    owner: fleetops
    format: '^(ghp_|github_pat_)[A-Za-z0-9_]{20,}$'
    purpose: "GitHub fine-grained token for releases and discussions of the product repositories"
    get_it: "https://github.com/settings/personal-access-tokens"
    revoke: "https://github.com/settings/personal-access-tokens"
    check: {method: GET, url: "https://api.github.com/rate_limit", auth: bearer}
  - name: X_ACCESS_TOKEN
    group: publisher
    service: publisher
    file: /etc/agent-fleet/secrets/publisher.env
    owner: fleetops
    format: '^[A-Za-z0-9_\-%]{20,}$'
    purpose: "X user access token. The X adapter stays off until X API access exists."
    get_it: "https://developer.x.com"
    revoke: "https://x.com/settings/connected_apps"
    check: {type: skip, reason: "X adapter is off"}
  - name: REDDIT_CLIENT_SECRET
    group: publisher
    service: publisher
    file: /etc/agent-fleet/secrets/publisher.env
    owner: fleetops
    format: '^[A-Za-z0-9_\-]{20,}$'
    purpose: "Reddit app secret. The Reddit adapter stays off until Reddit API access exists."
    get_it: "https://www.reddit.com/prefs/apps"
    revoke: "https://www.reddit.com/prefs/apps"
    check: {type: skip, reason: "Reddit adapter is off"}

  # ---- deployer ----
  - name: CLOUDFLARE_API_TOKEN
    group: deployer
    service: deployer
    file: /etc/agent-fleet/secrets/deployer.env
    owner: fleetops
    format: '^[A-Za-z0-9_\-]{40}$'
    purpose: "Cloudflare token for Workers, Pages, and D1 on the free plan"
    get_it: "https://dash.cloudflare.com/profile/api-tokens"
    revoke: "https://dash.cloudflare.com/profile/api-tokens"
    check: {method: GET, url: "https://api.cloudflare.com/client/v4/user/tokens/verify", auth: bearer}
  - name: CLOUDFLARE_DEPLOYER_ACCOUNT_ID
    group: deployer
    service: deployer
    file: /etc/agent-fleet/secrets/deployer.env
    owner: fleetops
    format: '^[0-9a-f]{32}$'
    purpose: "Cloudflare account ID (an identifier, kept with the token)"
    get_it: "https://dash.cloudflare.com"
    revoke: "not applicable"
    check: {type: skip, reason: "checked together with the token"}

  # ---- control ----
  - name: CONTROL_TELEGRAM_BOT_TOKEN
    group: control
    service: control
    file: /etc/agent-fleet/secrets/control.env
    owner: fleetops
    format: '^[0-9]{6,12}:[A-Za-z0-9_\-]{30,}$'
    purpose: "Telegram bot token for the control bot and the daily brief"
    get_it: "https://t.me/BotFather"
    revoke: "https://t.me/BotFather"
    check: {type: telegram_getme}
  - name: CONTROL_DISCORD_BOT_TOKEN
    group: control
    service: control
    file: /etc/agent-fleet/secrets/control.env
    owner: fleetops
    format: '^[A-Za-z0-9_\-]{20,}\.[A-Za-z0-9_\-]{5,}\.[A-Za-z0-9_\-]{20,}$'
    purpose: "Discord bot token for the control bot and the daily brief"
    get_it: "https://discord.com/developers/applications"
    revoke: "https://discord.com/developers/applications"
    check: {method: GET, url: "https://discord.com/api/v10/users/@me", auth: header, header: "Authorization", prefix: "Bot "}

  # ---- briefing ----
  - name: SMTP_PASSWORD
    group: briefing
    service: briefing
    file: /etc/agent-fleet/secrets/briefing.env
    owner: fleetops
    format: '^.{8,}$'
    purpose: "SMTP password or app password for the daily brief email"
    get_it: "your mail provider"
    revoke: "your mail provider"
    check: {type: smtp_login}

  # ---- backup ----
  - name: BACKUP_GITHUB_TOKEN
    group: backup
    service: backup
    file: /etc/agent-fleet/secrets/backup.env
    owner: fleetops
    format: '^(ghp_|github_pat_)[A-Za-z0-9_]{20,}$'
    purpose: "GitHub token that pushes the repository (no secrets in it) after each backup"
    get_it: "https://github.com/settings/personal-access-tokens"
    revoke: "https://github.com/settings/personal-access-tokens"
    check: {method: GET, url: "https://api.github.com/rate_limit", auth: bearer}

  # ---- internal (the installer makes these) ----
  - name: JWT_SECRET
    group: internal
    service: router
    file: /etc/agent-fleet/secrets/router.env
    owner: fleetops
    format: '^[A-Za-z0-9+/=_\-]{32,}$'
    purpose: "OmniRoute session signing secret"
    get_it: "made by the installer"
    revoke: "run: fleetctl secret rotate JWT_SECRET"
    auto: true
    check: {type: skip, reason: "internal"}
  - name: API_KEY_SECRET
    group: internal
    service: router
    file: /etc/agent-fleet/secrets/router.env
    owner: fleetops
    format: '^[A-Za-z0-9+/=_\-]{32,}$'
    purpose: "OmniRoute secret that encrypts the stored provider keys"
    get_it: "made by the installer"
    revoke: "do not rotate it. The router could no longer read its stored keys."
    auto: true
    check: {type: skip, reason: "internal"}
  - name: STORAGE_ENCRYPTION_KEY
    group: internal
    service: router
    file: /etc/agent-fleet/secrets/router.env
    owner: fleetops
    format: '^[A-Za-z0-9+/=_\-]{32,}$'
    purpose: "OmniRoute key that encrypts its database at rest"
    get_it: "made by the installer"
    revoke: "do not rotate it. The router could no longer read its database."
    auto: true
    check: {type: skip, reason: "internal"}
  - name: INITIAL_PASSWORD
    group: internal
    service: router
    file: /etc/agent-fleet/secrets/router-admin.env
    owner: fleetops
    format: '^[A-Za-z0-9+/=_\-]{16,}$'
    purpose: "OmniRoute management password. The router and the quota tracker read it. It is in its own file so the quota tracker never sees a provider key."
    get_it: "made by the installer"
    revoke: "run: fleetctl secret rotate INITIAL_PASSWORD"
    auto: true
    check: {type: skip, reason: "internal"}
  - name: SEARXNG_SECRET
    group: internal
    service: searxng
    file: /etc/agent-fleet/secrets/searxng.env
    owner: fleetops
    format: '^[A-Za-z0-9+/=_\-]{32,}$'
    purpose: "SearXNG instance secret"
    get_it: "made by the installer"
    revoke: "run: fleetctl secret rotate SEARXNG_SECRET"
    auto: true
    check: {type: skip, reason: "internal"}
  - name: CONTROL_NOTIFY_TOKEN
    group: internal
    service: briefing
    file: /etc/agent-fleet/secrets/briefing.env
    owner: fleetops
    format: '^[A-Za-z0-9_\-]{32,}$'
    purpose: "Local token that the briefing presents to the control bot to reach the owner"
    get_it: "made by the installer"
    revoke: "run: fleetctl secret rotate CONTROL_NOTIFY_TOKEN"
    auto: true
    check: {type: skip, reason: "local token"}
  - name: ROUTER_KEY_HERMES
    group: internal
    service: hermes
    file: /home/fleet/.hermes/.env
    owner: fleet
    format: '^[A-Za-z0-9_\-]{32,}$'
    purpose: "Local key that Hermes presents to the router on 127.0.0.1"
    also_files: ["/home/fleet/.hermes/profiles/*/.env"]
    get_it: "made by the installer"
    revoke: "run: fleetctl secret rotate ROUTER_KEY_HERMES"
    auto: router_key
    check: {type: router_models}
  - name: ROUTER_KEY_BRIEFING
    group: internal
    service: briefing
    file: /etc/agent-fleet/secrets/briefing.env
    owner: fleetops
    format: '^[A-Za-z0-9_\-]{32,}$'
    purpose: "Local key that the briefing presents to the router"
    get_it: "made by the installer"
    revoke: "run: fleetctl secret rotate ROUTER_KEY_BRIEFING"
    auto: router_key
    check: {type: router_models}
  - name: ROUTER_KEY_DEV
    group: internal
    service: dev-tests
    file: /etc/agent-fleet/secrets/router-dev.env
    owner: root
    format: '^[A-Za-z0-9_\-]{32,}$'
    purpose: "Local key for tests only. It can call only fleet-dev, which holds the trial models. No fleet service reads it"
    get_it: "made by the installer"
    revoke: "run: fleetctl secret rotate ROUTER_KEY_DEV"
    auto: router_key
    check: {type: router_models}
  - name: N8N_ENCRYPTION_KEY
    group: internal
    service: n8n
    file: /etc/agent-fleet/secrets/n8n.env
    owner: fleetops
    format: '^[A-Za-z0-9_\-]{32,}$'
    purpose: "n8n encrypts the credentials that it stores with this key. A new key makes every stored credential unreadable"
    get_it: "made by the installer"
    revoke: "do not rotate. To replace it, export the credentials with fleetctl n8n backup, set a new key, and import them again"
    auto: true
    check: {type: skip, reason: internal}
  - name: N8N_INSTANCE_OWNER_PASSWORD_HASH
    group: internal
    service: n8n
    file: /etc/agent-fleet/secrets/n8n.env
    owner: fleetops
    format: '^\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53}$'
    purpose: "bcrypt hash of the n8n owner password. n8n makes the owner account from it at each start"
    get_it: "made from N8N_OWNER_PASSWORD by fleetctl n8n prepare"
    revoke: "run: fleetctl secret rotate N8N_OWNER_PASSWORD"
    auto: derived
    check: {type: skip, reason: internal}
  - name: N8N_OWNER_PASSWORD
    group: internal
    service: n8n-admin
    file: /etc/agent-fleet/secrets/n8n-admin.env
    owner: root
    format: '^[A-Za-z0-9_\-]{20,}$'
    purpose: "Password of the n8n owner account. Only root and fleetctl read it. The owner reads it with: sudo fleetctl secret show N8N_OWNER_PASSWORD"
    get_it: "made by the installer"
    revoke: "run: fleetctl secret rotate N8N_OWNER_PASSWORD"
    auto: true
    check: {type: skip, reason: internal}
  - name: N8N_API_KEY
    group: internal
    service: n8n-admin
    file: /etc/agent-fleet/secrets/n8n-admin.env
    owner: root
    format: '^[A-Za-z0-9._\-]{20,}$'
    purpose: "n8n public API key with the smallest scopes that fleetctl needs. fleetctl and the n8n-mcp helper for Claude Code read it"
    get_it: "made by fleetctl n8n bootstrap through the n8n login"
    revoke: "in n8n open Settings, then n8n API, and delete the key. Then run: fleetctl n8n bootstrap"
    auto: derived
    check: {type: skip, reason: internal}
  - name: FLEET_EVENT_TOKEN
    group: internal
    service: events
    file: /etc/agent-fleet/secrets/events.env
    owner: fleetops
    format: '^[A-Za-z0-9_\-]{32,}$'
    purpose: "Header token that the event relay sends to the n8n webhook fleet-event. n8n holds the same value as a credential"
    get_it: "made by the installer"
    revoke: "run: fleetctl secret rotate FLEET_EVENT_TOKEN"
    auto: true
    check: {type: skip, reason: local token}
  - name: FLEET_ACTION_TOKEN
    group: internal
    service: n8n-admin
    file: /etc/agent-fleet/secrets/n8n-admin.env
    owner: root
    format: '^[A-Za-z0-9_\-]{32,}$'
    purpose: "Bearer token that n8n presents to the fleet action API of the control bot. The control bot holds only its hash"
    get_it: "made by the installer"
    revoke: "run: fleetctl secret rotate FLEET_ACTION_TOKEN"
    auto: true
    check: {type: skip, reason: local token}
  - name: N8N_TOOLS_TOKEN
    group: internal
    service: hermes
    file: /home/fleet/.hermes/.env
    owner: fleet
    format: '^[A-Za-z0-9_\-]{32,}$'
    purpose: "Bearer token that the Hermes agents present to the fleet-tools MCP server in n8n. Each agent sees only its own tools"
    also_files: ["/home/fleet/.hermes/profiles/*/.env"]
    get_it: "made by the installer"
    revoke: "run: fleetctl secret rotate N8N_TOOLS_TOKEN"
    auto: true
    check: {type: skip, reason: local token}
  - name: PUBLISHER_API_TOKEN
    group: internal
    service: hermes
    file: /home/fleet/.hermes/profiles/marketing/.env
    owner: fleet
    format: '^[A-Za-z0-9_\-]{32,}$'
    purpose: "Local token that the marketing agent presents to the Publisher"
    get_it: "made by the installer"
    revoke: "run: fleetctl secret rotate PUBLISHER_API_TOKEN"
    auto: true
    check: {type: skip, reason: "local token"}
  - name: PUBLISHER_REPLY_TOKEN
    group: internal
    service: hermes
    file: /home/fleet/.hermes/profiles/feedback/.env
    owner: fleet
    format: '^[A-Za-z0-9_\-]{32,}$'
    purpose: "Local token that the feedback agent presents to the Publisher. It can send only approved FAQ answers."
    get_it: "made by the installer"
    revoke: "run: fleetctl secret rotate PUBLISHER_REPLY_TOKEN"
    auto: true
    check: {type: skip, reason: "local token"}
  - name: DEPLOYER_API_TOKEN
    group: internal
    service: hermes
    file: /home/fleet/.hermes/profiles/build/.env
    owner: fleet
    format: '^[A-Za-z0-9_\-]{32,}$'
    purpose: "Local token that the build agent presents to the Deployer"
    get_it: "made by the installer"
    revoke: "run: fleetctl secret rotate DEPLOYER_API_TOKEN"
    auto: true
    check: {type: skip, reason: "local token"}

  - name: SLACK_HQ_BOT_TOKEN
    group: slack
    service: control
    file: /etc/agent-fleet/secrets/control.env
    owner: fleetops
