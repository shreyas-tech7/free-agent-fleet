# The tool catalog. One entry for each outside tool, skill source, model, or list that the owner named or that the fleet uses.
# The research agent reads it before the weekly scouting. The security agent reads it at the start of the install pipeline.
# The owner changes it. Agents cannot (merger gate G3 protects config/).
#
# rating   adopt   the fleet uses it. Keep it.
#          trial   a part of it is in use, or it is ready to try. The install gate still applies to each new part.
#          watch   not in use. Look again when the named condition is true.
#          reject  do not install it and do not file a request for it. The reason says why.
# status   installed  software on the machine, with a row in vendor/LOCK.md
#          vendored   text copied into skills/ at a pinned commit, with UPSTREAM.md
#          planned    wanted, but a named step is open
#          none       nothing is installed
# A rating is not an approval. Each install still needs the install gate and the owner's approval. See D-050 and D-076.
