# The support services of the fleet: n8n and SearXNG.
# ./install.sh starts them with its own systemd units and rootless Docker. Use this file only when you want to run
# the two services yourself, for example on a test machine. Both listen on 127.0.0.1 only.
# Put real values in a file named .env next to this file. Never commit that file. See .env.example.
services:
  n8n:
    image: "${N8N_IMAGE:?set N8N_IMAGE in .env. Use the pinned image in vendor/pins.env}"
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    environment:
      N8N_LISTEN_ADDRESS: 127.0.0.1
      N8N_PORT: "5678"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/files
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env. Make it with openssl rand -hex 32}"
      TZ: ${TZ:-UTC}
      GENERIC_TIMEZONE: ${TZ:-UTC}
    volumes:
      - n8n-data:/home/node/.n8n
      - n8n-files:/home/node/files
    tmpfs:
      - /tmp
      - /home/node/.cache
  searxng:
    image: "${SEARXNG_IMAGE:?set SEARXNG_IMAGE in .env. Use the pinned image in vendor/pins.env}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./config/searxng:/etc/searxng:ro
    tmpfs:
      - /tmp
      - /var/cache/searxng
volumes:
  n8n-data:
  n8n-files:
