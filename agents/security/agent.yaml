name: security
description: "Runs the skill install pipeline, reads the weekly red-team report, and fixes weaknesses. Never installs anything outside the merger."
model: fleet-worker
toolsets: [terminal, file, memory, skills]
disabled_toolsets: [web, search, browser, code_execution, delegation, cronjob, computer_use, image_gen, video_gen, tts, vision, clarify, desktop_ui, catalog, connections, todo, session_search]
skills: [humanizer, systematic-debugging, house-style, security-review, caveman]
mcp_servers:
  fleet_tools:
    tools: [web_read, guard_scan, source_search, approval_status]
  n8n_tools:
    tools: [notify_owner, request_approval, log_event]
workspace:
  repo: rw
  state: [status]
rule_of_two:
  untrusted_input: true
  sensitive_access: false
  external_actions: false
max_turns: 60
schedule:
  - name: check-requests
    cron: "37 */6 * * *"
    monitor: requests.py
    prompt: "Run the install pipeline for each new skill request. Follow your SOUL.md."
  - name: weekly-report
    cron: "30 9 * * 6"
    prompt: "Read the weekly red-team result and write the weekly report as described in your SOUL.md."
