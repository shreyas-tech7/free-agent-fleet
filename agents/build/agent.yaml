name: build
description: "Builds products for the Cloudflare Workers and Pages free plan with tests first. Fixes tickets. Deploys only through the Deployer."
model: fleet-coder
toolsets: [terminal, file, memory, skills]
disabled_toolsets: [web, search, browser, code_execution, delegation, cronjob, computer_use, image_gen, video_gen, tts, vision, clarify, desktop_ui, catalog, connections, todo, session_search]
skills: [humanizer, test-driven-development, writing-plans, using-git-worktrees, systematic-debugging, verification-before-completion, requesting-code-review, receiving-code-review, house-style]
mcp_servers:
  fleet_tools:
    tools: [ticket_list, ticket_update, deploy_commit, preview_start, preview_stop]
    env_from_profile: [DEPLOYER_API_TOKEN]
  playwright:
    package: "@playwright/mcp"
    local_only: true
  n8n_tools:
    tools: [request_approval, log_event]
workspace:
  repo: rw
  state: [status, tickets]
rule_of_two:
  untrusted_input: true
  sensitive_access: false
  external_actions: true
max_turns: 120
schedule: []
